{{- $target := .Params.redirect_url -}}
{{- with .Params.redirect_data -}}
  {{- $target = index hugo.Data .data .key -}}
{{- end -}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url={{ $target }}">
    <link rel="canonical" href="{{ $target }}">
    <title>{{ .Title }}</title>
  </head>
  <body>
    <p>Redirecting to <a href="{{ $target }}">{{ .Title }}</a>…</p>
  </body>
</html>
