{{- $content := .content -}}
{{- $endMark := .endMark -}}
{{- $markedContent := replaceRE `(?s)(.*?)(</p>)(\s*(?:<div class="footnotes".*)?)$` (printf `${1} %s${2}${3}` $endMark) $content 1 -}}
{{- if eq $markedContent $content -}}
  {{- $markedContent = print $content (printf `<p>%s</p>` $endMark) -}}
{{- end -}}
{{- return $markedContent -}}
