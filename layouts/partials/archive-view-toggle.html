{{- $current := .current -}}
<nav class="archive-view-toggle" aria-label="{{ i18n "archiveView" }}">
  <a href="{{ "posts/" | relLangURL }}"{{ if eq $current "list" }} aria-current="page"{{ end }}>{{ i18n "listView" }}</a>
  <a href="{{ "calendar/" | relLangURL }}"{{ if eq $current "calendar" }} aria-current="page"{{ end }}>{{ i18n "calendarView" }}</a>
</nav>
